
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Organize your studies. Achieve your goals.</p>
    </header>

    <main class="container">

        <section class="task-form">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <label for="taskName">Task Name</label>
                <input
                    type="text"
                    id="taskName"
                    placeholder="e.g. Complete Java assignment"
                    required
                >

                <label for="taskCategory">Subject</label>
                <select id="taskCategory" required>
                    <option value="">Choose a subject</option>
                    <option value="Java">Java</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Database">Database</option>
                    <option value="Other">Other</option>
                </select>

                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate" required>

                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="dashboard">
            <h2>My Tasks</h2>

            <div class="task-stats">
                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p id="totalTasks">0</p>
                </div>

                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="completedTasks">0</p>
                </div>

                <div class="stat-card">
                    <h3>Pending</h3>
                    <p id="pendingTasks">0</p>
                </div>
            </div>

            <div id="taskList">
                <p id="emptyMessage">No tasks yet. Add your first task!</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Student Task Manager | Built with HTML, CSS and JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
